name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        name: Tests & quality
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: loyalty_test
                    MYSQL_USER: loyalty
                    MYSQL_PASSWORD: secret
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20

        env:
            DB_CONNECTION: mysql
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: loyalty_test
            DB_USERNAME: loyalty
            DB_PASSWORD: secret
            REDIS_HOST: 127.0.0.1
            REDIS_PORT: 6379

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: pdo_mysql, bcmath, intl, zip, redis, pcov
                  coverage: pcov
                  tools: composer:v2

            - name: Cache composer packages
              uses: actions/cache@v4
              with:
                  path: ~/.composer/cache/files
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Run migrations
              run: php artisan migrate --force

            - name: Code style (Pint)
              run: ./vendor/bin/pint --test

            - name: Static analysis (Larastan)
              run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

            # The --min=80 threshold is enabled once domain services exist (Phase 2).
            - name: Tests (Pest with coverage)
              run: ./vendor/bin/pest --coverage

    gitleaks:
        name: Secret scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
