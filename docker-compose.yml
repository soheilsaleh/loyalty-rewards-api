name: loyalty-rewards-api

x-app-build: &app-build
    build:
        context: .
        dockerfile: docker/php/Dockerfile
        target: development
        args:
            UID: ${UID:-1000}
            GID: ${GID:-1000}
    image: loyalty-rewards-api-app
    restart: unless-stopped
    volumes:
        - ./:/var/www/html

services:
    app:
        <<: *app-build
        container_name: loyalty-app
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - loyalty

    nginx:
        image: nginx:1.27-alpine
        container_name: loyalty-nginx
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8000}:80"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - loyalty

    queue:
        <<: *app-build
        container_name: loyalty-queue
        command: php artisan queue:work --sleep=1 --tries=3 --backoff=10
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - loyalty

    scheduler:
        <<: *app-build
        container_name: loyalty-scheduler
        command: php artisan schedule:work
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - loyalty

    mysql:
        image: mysql:8.0
        container_name: loyalty-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-loyalty}
            MYSQL_USER: ${DB_USERNAME:-loyalty}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
        ports:
            - "${FORWARD_DB_PORT:-3307}:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - loyalty

    redis:
        image: redis:7-alpine
        container_name: loyalty-redis
        restart: unless-stopped
        command: ["redis-server", "--appendonly", "yes"]
        ports:
            - "${FORWARD_REDIS_PORT:-6380}:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - loyalty

    mailpit:
        image: axllent/mailpit:v1.21
        container_name: loyalty-mailpit
        restart: unless-stopped
        ports:
            - "${MAILPIT_UI_PORT:-8025}:8025"
        networks:
            - loyalty

volumes:
    mysql-data:
    redis-data:

networks:
    loyalty:
        driver: bridge
